name = "telepost-worker"
main = "src/index.ts"
compatibility_date = "2024-05-29"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
APP_URL = "https://telepost.app"

[[d1_databases]]
binding = "DB"
database_name = "telepost-db"
database_id = "YOUR_D1_DATABASE_ID"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "telepost-media"

[triggers]
crons = ["* * * * *"]
